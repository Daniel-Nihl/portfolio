{% load static i18n %}

<header class="navbar">

    <div class="container">

        <div class="navbar__content">

            <div class="navbar__left">

                <a href="{% url 'home' %}" class="navbar__logo" aria-label="{% translate 'Home' %}">

                    <img class="navbar__logo-image" src="{% static 'portfolio/img/DP_Logo.svg' %}" alt="Daniel Párraga">

                </a>

                <nav class="navbar__nav text-bold">

                    <a href="{% url 'home' %}">
                        {% translate "Portfolio" %}
                    </a>

                    <a href="{% url 'about' %}">
                        {% translate "About me" %}
                    </a>

                    <a href="{% url 'contact' %}">
                        {% translate "Contact" %}
                    </a>

                </nav>

            </div>

            <div class="navbar__language">

                <button
                        class="navbar__language-button text-bold"
                        type="button"
                        aria-expanded="false">

                    {% translate "Language" %}
                    <span class="navbar__language-arrow">▼</span>

                </button>

                <div class="navbar__language-menu">

                    <form action="{% url 'set_language' %}" method="post">
                        {% csrf_token %}

                        <input
                                type="hidden"
                                name="next"
                                value="{{ request.get_full_path }}">

                        <input
                                type="hidden"
                                name="language"
                                value="es">

                        <button
                                type="submit"
                                class="navbar__language-option">

                            🇪🇸 {% translate "Spanish" %}

                        </button>

                    </form>

                    <form action="{% url 'set_language' %}" method="post">
                        {% csrf_token %}

                        <input
                                type="hidden"
                                name="next"
                                value="{{ request.get_full_path }}">

                        <input
                                type="hidden"
                                name="language"
                                value="en">

                        <button
                                type="submit"
                                class="navbar__language-option">

                            🇬🇧 {% translate "English" %}

                        </button>

                    </form>

                </div>

            </div>

            <div class="navbar__view-mode" aria-label="{% translate 'View mode' %}">

                <button
                        class="navbar__view-button navbar__view-button--desktop navbar__view-button--active"
                        type="button"
                        aria-label="{% translate 'Desktop view' %}"
                        aria-pressed="true">

                    <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                        <rect x="3" y="4" width="18" height="13" rx="1.5"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>

                    </svg>

                </button>

                <span class="navbar__view-divider" aria-hidden="true"></span>

                <button
                        class="navbar__view-button navbar__view-button--mobile"
                        type="button"
                        aria-label="{% translate 'Mobile view' %}"
                        aria-pressed="false">

                    <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                        <rect x="7" y="2.5" width="10" height="19" rx="1.5"></rect>
                        <line x1="10" y1="5" x2="14" y2="5"></line>
                        <line x1="11" y1="18.5" x2="13" y2="18.5"></line>

                    </svg>

                </button>

            </div>

            <button
                    class="navbar__toggle"
                    type="button"
                    aria-label="{% translate 'Open menu' %}"
                    aria-expanded="false">

                ☰

            </button>

        </div>

    </div>

</header>
